on:
  push: 
   branches: ["develop"]
  workflow_dispatch:


jobs: 
  docker-check:
   runs-on: ubuntu-latest
   permissions:
    contents: read
   steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}

    - name: build
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/DevOps-SATC:0.0.1 .
